[project]
name = "worklore"
version = "0.1.0"
description = "Lore & Order: a queryable, source-cited library of your work meetings."
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1"]

[project.scripts]
lore = "worklore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worklore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
